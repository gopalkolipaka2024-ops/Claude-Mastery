name: Web quality

# Runs on every pull request that touches the site, and on pushes to main.
# Fails the check when the site breaks a budget from the performance spec:
#   - first-load JavaScript over 150 KB (gzip) on Home, Category, Search or Product
#   - lint or type errors
#   - unit or integration tests (integration tests use a throwaway Postgres service)
#   - Lighthouse (mobile, simulated slow 4G, 7 runs; best run for LCP and Performance, median
#     for the rest) under 95 on Performance,
#     Accessibility, Best Practices or SEO, LCP over 2.5 s, CLS over 0.1, or TBT over 200 ms
#   - a server secret in any file sent to browsers
#   - a Cloudflare Worker bundle over the free plan's 3 MB (compressed)
#   - any accessibility failure: axe on every page and Storybook story, plus keyboard checks
#     (skip link, visible focus, dialog focus traps, 44px tap targets, 320px reflow)
#   - end-to-end journeys (age gate, search, filters, product page, contact form) or a visual
#     change to a key page beyond 2% of pixels
# After an intended visual change, regenerate the screenshots with the "Update screenshot
# baselines" workflow (they must come from GitHub's machines, which render text slightly
# differently from other computers).
# Lighthouse reports are kept as a workflow artifact for 14 days.
on:
  workflow_dispatch:
  pull_request:
    paths: ["web/**", ".github/workflows/web-quality.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-quality.yml"]

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SITE_INDEXABLE: "1" # build as production would be, so SEO is measured with indexing on
      SITE_URL: http://localhost:3100 # canonical URLs must point at the server Lighthouse tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        id: install
        run: npm ci
      # Every check below runs even when an earlier one fails, so one red run shows every problem.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Unit and integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Color contrast of design tokens
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run tokens:check
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
        env:
          # Fake "canary" secrets: if any of these values shows up in browser files, the next step fails
          POS_WEBHOOK_SECRET: canary-pos-0f3a9c7e
          REVALIDATE_TOKEN: canary-reval-5b1d2e8f
          RESEND_API_KEY: re_canary11_canary22xyz
          TURNSTILE_SECRET_KEY: canary-turnstile-7c4e9a12
          CF_ACCESS_AUD: canary-aud-3e8b6d0c
          ADMIN_EMAILS: canary-admin@example.invalid
          CONTACT_TO: canary-to@example.invalid
      - name: No server secrets in browser files
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:secrets
        env:
          POS_WEBHOOK_SECRET: canary-pos-0f3a9c7e
          REVALIDATE_TOKEN: canary-reval-5b1d2e8f
          RESEND_API_KEY: re_canary11_canary22xyz
          TURNSTILE_SECRET_KEY: canary-turnstile-7c4e9a12
          CF_ACCESS_AUD: canary-aud-3e8b6d0c
          ADMIN_EMAILS: canary-admin@example.invalid
          CONTACT_TO: canary-to@example.invalid
      - name: Lighthouse budgets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run lhci
      - name: First-load JavaScript budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npm run start -- -p 3100 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100/ && break; sleep 1; done
          npm run budget:js
      - name: Install Chromium for browser checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Page checks (axe, SEO basics, filters, search)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:pages -- http://localhost:3100
      - name: Keyboard and interaction checks (focus, dialogs, tap targets, reflow)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:keyboard -- http://localhost:3100
      - name: End-to-end and visual regression tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:e2e
      - name: Storybook accessibility (axe on every story)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build-storybook && npm run test:a11y
      - name: Cloudflare build fits the Workers free plan (3 MB compressed)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npx opennextjs-cloudflare build
          npx wrangler deploy --dry-run --outdir /tmp/cf-dry 2>&1 | tee /tmp/cf-dry.log
          kib=$(grep -oE 'gzip: [0-9.]+ KiB' /tmp/cf-dry.log | grep -oE '[0-9.]+')
          echo "Worker size: ${kib} KiB compressed (limit 3072)"
          awk -v k="$kib" 'BEGIN { exit (k == "" || k > 3000) }' || { echo "::error::Worker is ${kib} KiB compressed; the free plan allows 3,072 KiB."; exit 1; }
      - name: Keep the end-to-end report (failures include traces and image diffs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14
      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: web/.lighthouseci
          include-hidden-files: true # .lighthouseci starts with a dot, which upload-artifact skips by default
          retention-days: 14

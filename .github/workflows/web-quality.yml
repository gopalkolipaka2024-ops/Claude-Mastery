name: Web quality

# Runs on every pull request that touches the site, and on pushes to main.
# Fails the check when the site breaks a budget from the performance spec:
#   - first-load JavaScript over 150 KB (gzip) on Home, Category, Search or Product
#   - Lighthouse (mobile, simulated slow 4G, median of 5 runs) under 95 on Performance,
#     Accessibility, Best Practices or SEO, LCP over 2.5 s, CLS over 0.1, or TBT over 200 ms
#   - a server secret in any file sent to browsers
#   - any accessibility failure: axe on every page and Storybook story, plus keyboard checks
#     (skip link, visible focus, dialog focus traps, 44px tap targets, 320px reflow)
# Lighthouse reports are kept as a workflow artifact for 14 days.
on:
  pull_request:
    paths: ["web/**", ".github/workflows/web-quality.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-quality.yml"]

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SITE_INDEXABLE: "1" # build as production would be, so SEO is measured with indexing on
      SITE_URL: http://localhost:3100 # canonical URLs must point at the server Lighthouse tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Color contrast of design tokens
        run: npm run tokens:check
      - name: Build
        run: npm run build
        env:
          # Fake "canary" secrets: if any of these values shows up in browser files, the next step fails
          POS_WEBHOOK_SECRET: canary-pos-0f3a9c7e
          REVALIDATE_TOKEN: canary-reval-5b1d2e8f
          RESEND_API_KEY: re_canary11_canary22xyz
          TURNSTILE_SECRET_KEY: canary-turnstile-7c4e9a12
          CF_ACCESS_AUD: canary-aud-3e8b6d0c
          ADMIN_EMAILS: canary-admin@example.invalid
          CONTACT_TO: canary-to@example.invalid
      - name: No server secrets in browser files
        run: npm run check:secrets
        env:
          POS_WEBHOOK_SECRET: canary-pos-0f3a9c7e
          REVALIDATE_TOKEN: canary-reval-5b1d2e8f
          RESEND_API_KEY: re_canary11_canary22xyz
          TURNSTILE_SECRET_KEY: canary-turnstile-7c4e9a12
          CF_ACCESS_AUD: canary-aud-3e8b6d0c
          ADMIN_EMAILS: canary-admin@example.invalid
          CONTACT_TO: canary-to@example.invalid
      - name: Lighthouse budgets
        run: npm run lhci
      - name: First-load JavaScript budget
        run: |
          npm run start -- -p 3100 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100/ && break; sleep 1; done
          npm run budget:js
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Page checks (axe, SEO basics, filters, search)
        run: npm run test:pages -- http://localhost:3100
      - name: Keyboard and interaction checks (focus, dialogs, tap targets, reflow)
        run: npm run test:keyboard -- http://localhost:3100
      - name: Storybook accessibility (axe on every story)
        run: npm run build-storybook && npm run test:a11y
      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: web/.lighthouseci
          retention-days: 14

name: Deploy

# Cloudflare Workers deployments (see web/docs/runbook.md for setup).
#   Pull request → a private preview version of the staging worker, smoke-tested, link posted on the PR
#   Push to main → staging (migrations, deploy, smoke test)
#   Production  → only by hand ("Run workflow", target: production), only when the repository
#                 variable PRODUCTION_ENABLED is "true", only after typing the site's domain, and
#                 after approval on the "production" environment. A failed health check after
#                 deploy rolls back automatically.
# Every job skips cleanly until CLOUDFLARE_API_TOKEN is set for its environment.
on:
  pull_request:
    paths: ["web/**", ".github/workflows/deploy.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy"
        type: choice
        options: [staging, production]
        default: staging
      confirm:
        description: "Production only: type the site's domain (e.g. example.com) to confirm"
        type: string
        required: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  preview:
    # Secrets aren't available to pull requests from forks, so only same-repository PRs get a preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    concurrency: { group: "preview-${{ github.event.number }}", cancel-in-progress: true }
    defaults: { run: { working-directory: web } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Skip until Cloudflare is set up
        id: gate
        run: if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN for 'preview'; skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - name: Build for Cloudflare
        if: steps.gate.outputs.go == 'true'
        run: npx opennextjs-cloudflare build
      - name: Upload a preview version (does not change what staging serves)
        if: steps.gate.outputs.go == 'true'
        id: upload
        run: |
          npx opennextjs-cloudflare upload -- --preview-alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }} ${GITHUB_SHA::7}" 2>&1 | tee upload.log
          url=$(grep -oE 'https://pr-${{ github.event.number }}-[a-z0-9.-]+\.workers\.dev' upload.log | head -1)
          [ -n "$url" ] || { echo "::error::No preview URL in the upload output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test the preview
        if: steps.gate.outputs.go == 'true'
        run: |
          npx playwright install --with-deps chromium
          E2E_BASE_URL="${{ steps.upload.outputs.url }}" npx playwright test --grep-invert @visual --project=phone
      - name: Post the preview link on the pull request
        if: steps.gate.outputs.go == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- preview-link -->";
            const body = `${marker}\n**Preview:** ${{ steps.upload.outputs.url }}\n\nBuilt from ${context.sha.slice(0, 7)}. Uses staging data; not indexed by search engines.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  staging:
    if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: { name: staging, url: "${{ vars.SITE_URL }}" }
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    defaults: { run: { working-directory: web } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
      SITE_URL: ${{ vars.SITE_URL }}
      CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Skip until Cloudflare is set up
        id: gate
        run: if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN for 'staging'; skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - name: Database migrations
        if: steps.gate.outputs.go == 'true' && env.DATABASE_URL_OWNER != ''
        run: npm run db:migrate
      - name: Build for Cloudflare
        if: steps.gate.outputs.go == 'true'
        run: npx opennextjs-cloudflare build
      - name: Deploy to staging
        if: steps.gate.outputs.go == 'true'
        run: npx opennextjs-cloudflare deploy -- --message "staging ${GITHUB_SHA::7}"
      - name: Smoke test staging
        if: steps.gate.outputs.go == 'true'
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "$SITE_URL/api/health"
          npx playwright install --with-deps chromium
          E2E_BASE_URL="$SITE_URL" npx playwright test --grep-invert @visual

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Add required reviewers to this environment (Settings → Environments → production)
    environment: { name: production, url: "${{ vars.SITE_URL }}" }
    concurrency: { group: deploy-production, cancel-in-progress: false }
    defaults: { run: { working-directory: web } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_INDEXABLE: "1"
      CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Production must be switched on and confirmed
        env:
          ENABLED: ${{ vars.PRODUCTION_ENABLED }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$ENABLED" = "true" ] || { echo "::error::Production deploys are switched off (repository variable PRODUCTION_ENABLED is not \"true\")."; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::No CLOUDFLARE_API_TOKEN for the production environment."; exit 1; }
          host=$(echo "$SITE_URL" | sed -E 's#^https?://##; s#/.*$##; s#^www\.##')
          [ "$(echo "$CONFIRM" | sed 's#^www\.##')" = "$host" ] || { echo "::error::Type the domain ($host) in the confirm box to deploy production."; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Remember the live version (for automatic rollback)
        id: before
        # Empty on the very first deploy (nothing to roll back to)
        run: echo "version=$(npx wrangler deployments status --env production --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).versions?.[0]?.version_id??"")}catch{console.log("")}})')" >> "$GITHUB_OUTPUT"
      - name: Database migrations
        if: env.DATABASE_URL_OWNER != ''
        run: npm run db:migrate
      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
      - name: Deploy to production
        run: npx opennextjs-cloudflare deploy --env production -- --message "production ${GITHUB_SHA::7}"
      - name: Check the live site
        id: health
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 "$SITE_URL/api/health" | grep -q '"status":"ok"'; then echo "Healthy."; exit 0; fi
            sleep 10
          done
          echo "::error::The new version is not healthy."; exit 1
      - name: Roll back automatically if unhealthy
        if: failure() && steps.health.outcome == 'failure' && steps.before.outputs.version != ''
        run: |
          npx wrangler rollback "${{ steps.before.outputs.version }}" --env production --message "Automatic rollback: health check failed after ${GITHUB_SHA::7}"

name: Product photos

# Runs free on GitHub's servers, so no photos are downloaded to your own computer.
# Gets each product's full-size front-of-pack photo from Open Food Facts (CC BY-SA),
# removes the background with the open-source rembg model, centers it on white like
# a delivery-app listing, rebuilds the photo sheets and the site in docs/, and commits
# the result. Cleaned photos are cached between runs, so later runs only process new
# products. Runs weekly; start it any time from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: write

concurrency: product-photos

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow scipy "rembg[cpu]==2.0.86"
      - name: Restore photo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .photo-cache
            ~/.u2net
            ~/.rembg
          key: photos-${{ github.run_id }}
          restore-keys: photos-
      - name: Full-size photos from Open Food Facts
        run: python3 scripts/fetch_photos.py .photo-cache
      - name: Remove backgrounds and center on white
        run: python3 scripts/enhance_photos.py .photo-cache
      - name: Save photo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .photo-cache
            ~/.u2net
            ~/.rembg
          key: photos-${{ github.run_id }}
      - name: Rebuild photo sheets and site
        run: |
          python3 scripts/build_photo_sheets.py .photo-cache
          python3 scripts/build_site.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add photos docs data/photo-sources.json
          git commit -m "Update product photos" || echo "No changes to commit"
          git push

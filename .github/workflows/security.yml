name: Security

# Dependency audit and secret scanning. Runs on pull requests, pushes to main, and every
# Monday, so newly published vulnerabilities in existing dependencies are caught too.
#   - Production dependencies (what visitors' requests run through): any high or critical
#     advisory fails the check.
#   - Development tooling (build, test, Lighthouse, Storybook): reported, not blocking. It never
#     runs on the live site; Dependabot proposes the upgrades.
#   - Gitleaks scans the repository and its history for committed credentials.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 13 * * 1" # Mondays, 8:23 / 9:23 am Boston time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Development tooling (report only)
        run: npm audit --audit-level=critical || echo "::warning::Development dependencies have known advisories; see the log above."

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

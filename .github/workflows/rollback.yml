name: Roll back

# One-click rollback: Actions → "Roll back" → Run workflow. Leave the version empty to go back
# to the previous version, or paste a version ID from "wrangler deployments list" or the
# Cloudflare dashboard (Workers → the worker → Deployments). The same is possible in the
# dashboard itself with its "Rollback" button.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [production, staging]
        default: production
      version:
        description: "Version ID to restore (empty = the previous one)"
        type: string
        required: false
      reason:
        description: "Why (shown in Cloudflare's deployment history)"
        type: string
        default: "Manual rollback"

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    defaults: { run: { working-directory: web } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Roll back
        env:
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
          TARGET: ${{ inputs.environment }}
        run: |
          envflag=""; [ "$TARGET" = "production" ] && envflag="--env production"
          npx wrangler rollback $VERSION $envflag --message "$REASON"
      - name: Check the site afterwards
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "$SITE_URL/api/health"

name: Update screenshot baselines

# Regenerates the visual-regression screenshots on GitHub's own machines and commits them to the
# branch it runs on. Fonts and anti-aliasing differ slightly between computers, so baselines must
# come from the same kind of machine that compares them in "Web quality".
# Run it by hand (Actions → "Update screenshot baselines" → choose the branch) after an intended
# visual change, then review the committed images in the pull request before merging.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SITE_INDEXABLE: "1"
      SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Take new screenshots
        run: npx playwright test --grep @visual --update-snapshots
      - name: Commit them
        run: |
          git add e2e/__screenshots__
          if git diff --cached --quiet; then echo "Screenshots unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update screenshot baselines from GitHub's runners"
          git push

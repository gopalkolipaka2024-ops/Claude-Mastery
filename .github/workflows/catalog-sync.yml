name: Catalog sync

# Nightly full resync from the point of sale into the database, as a safety net behind the
# live webhook. Free on GitHub Actions. A failed run marks this workflow red and GitHub emails
# the repo owner; with SENTRY_DSN set it is also reported to Sentry. Logs are JSON lines.
# Setup: repository secrets DATABASE_URL_WRITE, SITE_URL, REVALIDATE_TOKEN (and optionally SENTRY_DSN).
# Until Bottle POS provides a feed, it re-applies the cleaned export (no-op when nothing changed).
on:
  workflow_dispatch:
  schedule:
    - cron: "41 8 * * *" # 3:41 / 4:41 am Boston time

permissions:
  contents: read

concurrency: catalog-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL_WRITE: ${{ secrets.DATABASE_URL_WRITE }}
      SITE_URL: ${{ secrets.SITE_URL }}
      REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }} # failures also become Sentry alerts (optional)
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the database is configured
        id: gate
        run: |
          if [ -z "$DATABASE_URL_WRITE" ]; then echo "DATABASE_URL_WRITE secret not set; skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.gate.outputs.go == 'true'
        run: npm ci --ignore-scripts
      - name: Sync
        if: steps.gate.outputs.go == 'true'
        run: npm run sync -- --source export
